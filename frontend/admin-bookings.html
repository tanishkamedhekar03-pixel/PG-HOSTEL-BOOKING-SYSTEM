<!DOCTYPE html>
<html>
<head>
  <title>Admin - Booking Requests</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

  <style>
    body {
      background: #f5f5f5;
      font-family: Arial;
    }

    .container {
      margin-top: 40px;
    }

    .status {
      font-weight: bold;
    }

    .pending { color: orange; }
    .approved { color: green; }
    .rejected { color: red; }

    .btn-sm {
      margin-right: 5px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2 class="mb-4">Admin - Booking Requests</h2>

  <table class="table table-bordered table-striped">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Date</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="bookingTable"></tbody>
  </table>
</div>

<script>

// ===== FAKE BOOKINGS =====
let bookings = [
  {id:1, name:"Rahul", phone:"9876543210", date:"2026-03-20", status:"Pending"},
  {id:2, name:"Priya", phone:"9123456780", date:"2026-03-21", status:"Pending"},
  {id:3, name:"Aman", phone:"9988776655", date:"2026-03-22", status:"Approved"},
  {id:4, name:"Sneha", phone:"9012345678", date:"2026-03-23", status:"Rejected"}
];

// ===== LOAD TABLE =====
function loadBookings() {
  const table = document.getElementById("bookingTable");
  table.innerHTML = "";

  bookings.forEach((b, index) => {
    let statusClass =
      b.status === "Approved" ? "approved" :
      b.status === "Rejected" ? "rejected" : "pending";

    table.innerHTML += `
      <tr>
        <td>${index + 1}</td>
        <td>${b.name}</td>
        <td>${b.phone}</td>
        <td>${b.date}</td>
        <td class="status ${statusClass}">${b.status}</td>
        <td>
          <button class="btn btn-success btn-sm" onclick="approve(${b.id})">Approve</button>
          <button class="btn btn-danger btn-sm" onclick="reject(${b.id})">Reject</button>
        </td>
      </tr>
    `;
  });
}

// ===== APPROVE =====
function approve(id) {
  bookings = bookings.map(b => {
    if (b.id === id) b.status = "Approved";
    return b;
  });
  loadBookings();
}

// ===== REJECT =====
function reject(id) {
  bookings = bookings.map(b => {
    if (b.id === id) b.status = "Rejected";
    return b;
  });
  loadBookings();
}

// LOAD ON START
loadBookings();

</script>

</body>
</html>
