<!DOCTYPE html>
<html>
<head>
<title>Admin Reports</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family: Poppins;
background:#f1f5f9;
margin:0;
}

/* HEADER */
.header{
background:#1e293b;
color:white;
padding:15px 25px;
font-size:22px;
font-weight:600;
}

/* CONTAINER */
.container-box{
padding:25px;
}

/* CARDS */
.card-box{
background:white;
border-radius:10px;
padding:15px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card-box h3{
margin:0;
font-weight:600;
}

.card-box p{
margin:0;
color:gray;
}

/* GRAPH SECTIONS */
.graph-box{
background:white;
border-radius:10px;
padding:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
margin-top:20px;
}

/* FIX GRAPH SIZE */
canvas{
width:100% !important;
height:220px !important;
}
</style>

</head>

<body>

<div class="header">
Admin Reports Dashboard
</div>

<div class="container-box">

<!-- STATS -->
<div class="row g-3">

<div class="col-md-3">
<div class="card-box">
<h3 id="todayBookings">0</h3>
<p>Today's Bookings</p>
</div>
</div>

<div class="col-md-3">
<div class="card-box">
<h3 id="pendingPayments">0</h3>
<p>Pending Payments</p>
</div>
</div>

<div class="col-md-3">
<div class="card-box">
<h3 id="totalPGs">0</h3>
<p>Total PGs</p>
</div>
</div>

<div class="col-md-3">
<div class="card-box">
<h3 id="totalUsers">0</h3>
<p>Total Users</p>
</div>
</div>

</div>

<!-- BAR + LINE -->
<div class="row">

<div class="col-md-6">
<div class="graph-box">
<h6>System Overview</h6>
<canvas id="barChart"></canvas>
</div>
</div>

<div class="col-md-6">
<div class="graph-box">
<h6>Monthly Growth</h6>
<canvas id="lineChart"></canvas>
</div>
</div>

</div>

<!-- PIE CENTER -->
<div class="row justify-content-center">
<div class="col-md-4">
<div class="graph-box text-center">
<h6>Distribution</h6>
<canvas id="pieChart"></canvas>
</div>
</div>
</div>

</div>

<script>

// DATA
const data = {
todayBookings: 18,
pendingPayments: 4,
totalPGs: 22,
totalUsers: 35,
monthly: [5,8,12,10,15,20]
};

// SET VALUES
document.getElementById("todayBookings").innerText = data.todayBookings;
document.getElementById("pendingPayments").innerText = data.pendingPayments;
document.getElementById("totalPGs").innerText = data.totalPGs;
document.getElementById("totalUsers").innerText = data.totalUsers;

// BAR CHART
new Chart(document.getElementById("barChart"), {
type: 'bar',
data: {
labels: ['Bookings','Pending','PGs','Users'],
datasets: [{
data: [
data.todayBookings,
data.pendingPayments,
data.totalPGs,
data.totalUsers
]
}]
}
});

// LINE CHART
new Chart(document.getElementById("lineChart"), {
type: 'line',
data: {
labels: ['Jan','Feb','Mar','Apr','May','Jun'],
datasets: [{
data: data.monthly
}]
}
});

// PIE CHART
new Chart(document.getElementById("pieChart"), {
type: 'pie',
data: {
labels: ['Bookings','Pending'],
datasets: [{
data: [data.todayBookings,data.pendingPayments]
}]
}
});

</script>

</body>
</html>
