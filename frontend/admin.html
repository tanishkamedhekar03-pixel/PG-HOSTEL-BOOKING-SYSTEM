<!DOCTYPE html>
<html>

<head>

<title>PG Admin Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

body{
font-family:Poppins;
background:#f4f6fb;
}

/* SIDEBAR */

.sidebar{
position:fixed;
height:100%;
width:220px;
background:#1e293b;
padding-top:20px;
color:white;
}

.sidebar h3{
text-align:center;
margin-bottom:30px;
}

.sidebar a{
display:block;
color:white;
padding:12px 20px;
text-decoration:none;
}

.sidebar a:hover{
background:#334155;
}

/* MAIN */

.main{
margin-left:230px;
padding:20px;
}

/* STAT CARDS */

.stat-card{
border-radius:15px;
padding:20px;
color:white;
box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

.bg1{background:linear-gradient(45deg,#ff416c,#ff4b2b);}
.bg2{background:linear-gradient(45deg,#36d1dc,#5b86e5);}
.bg3{background:linear-gradient(45deg,#11998e,#38ef7d);}

/* FORM */

.admin-card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* PG CARDS */

.pg-card{
background:white;
border-radius:15px;
overflow:hidden;
transition:0.3s;
box-shadow:0 10px 20px rgba(0,0,0,0.15);
}

.pg-card:hover{
transform:translateY(-6px);
}

.pg-img img{
width:100%;
height:180px;
object-fit:cover;
}

.edit-btn{
background:#007bff;
border:none;
color:white;
border-radius:20px;
padding:6px 10px;
}

.delete-btn{
background:#ff3b3b;
border:none;
color:white;
border-radius:20px;
padding:6px 10px;
}

</style>

</head>

<body>


<!-- SIDEBAR -->

<div class="sidebar">

<h3>🏠 Admin</h3>

<a href="#"><i class="fa fa-chart-line"></i> Dashboard</a>
<a href="manage-pg.html"><i class="fa fa-bed"></i> Manage PG</a>
<a href="bookings.html"><i class="fa fa-calendar"></i> Bookings</a>
<a href="reviews.html"><i class="fa fa-star"></i> Reviews</a>
<a href="report-admin.html"><i class="fa fa-chart-pie"></i> Reports</a>

</div>



<div class="main">


<h2 class="mb-4">Dashboard</h2>


<!-- STATS -->

<div class="row mb-4">

<div class="col-md-4">

<div class="stat-card bg1">
<h4 id="totalPG">0</h4>
<p>Total PG</p>
</div>

</div>

<div class="col-md-4">

<div class="stat-card bg2">
<h4 id="totalCities">0</h4>
<p>Total Cities</p>
</div>

</div>

<div class="col-md-4">

<div class="stat-card bg3">
<h4>Admin</h4>
<p>PG Manager</p>
</div>

</div>

</div>



<!-- ADD PG FORM -->

<div class="admin-card mb-5">

<h4 class="mb-3">Add New PG</h4>

<form id="pgForm">

<div class="row">

<div class="col-md-6 mb-3">
<input type="text" id="name" class="form-control" placeholder="PG Name" required>
</div>

<div class="col-md-6 mb-3">
<input type="text" id="city" class="form-control" placeholder="City">
</div>

<div class="col-md-6 mb-3">
<input type="text" id="location" class="form-control" placeholder="Location">
</div>

<div class="col-md-6 mb-3">
<input type="number" id="price" class="form-control" placeholder="Price">
</div>

<div class="col-md-6 mb-3">
<select id="type" class="form-control">
<option value="PG">PG</option>
<option value="Hostel">Hostel</option>
</select>
</div>

<div class="col-md-6 mb-3">
<select id="gender" class="form-control">
<option value="Boys">Boys</option>
<option value="Girls">Girls</option>
<option value="Unisex">Unisex</option>
</select>
</div>

<div class="col-md-12 mb-3">
<input type="text" id="image" class="form-control" placeholder="Image URL">
</div>

<div class="col-md-12 mb-3">
<textarea id="description" class="form-control" placeholder="Description"></textarea>
</div>

<div class="col-md-12 mb-3">
<input type="text" id="amenities" class="form-control" placeholder="WiFi,Food,AC">
</div>

</div>

<button class="btn btn-success w-100">Add PG</button>

</form>

</div>



<!-- PG LIST -->

<h3 class="mb-3">All PGs</h3>

<div id="pgContainer" class="row"></div>
<!-- BOOKINGS SECTION -->

<h3 class="mt-5 mb-3">Bookings</h3>

<div id="bookingContainer" class="row"></div>
</div>


<script src="js/admin.js"></script>

</body>
</html>
</html>
