<!DOCTYPE html>
<html>
<head>
<title>Reviews</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>
body{
background:#f1f5f9;
font-family:Poppins;
}
</style>

</head>

<body class="p-4">

<h3>Reviews</h3>

<div id="reviewList"></div>

<script>
window.onload = function(){

  let data = [
    {user:"Tanishka", comment:"Very clean and safe PG."},
    {user:"Rahul", comment:"Affordable and good location."},
    {user:"Priya", comment:"Food quality is good."}
  ];

  let html = "";

  data.forEach(r=>{
    html += `
    <div class="card mb-3 p-3">
      <h5>${r.user}</h5>
      <p>${r.comment}</p>
    </div>`;
  });

  document.getElementById("reviewList").innerHTML = html;
}
</script>

</body>
</html>
