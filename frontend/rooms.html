<!DOCTYPE html>
<html>
<head>
  <title>Available Rooms</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #f8f9fa;
    }
    .card {
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="index.html">PG Booking</a>
    <a href="dashboard.html" class="btn btn-warning">Dashboard</a>
  </div>
</nav>

<div class="container mt-5">

  <h2 class="text-center mb-4">Available PGs</h2>

  <!-- SEARCH BAR -->
  <input type="text" id="search" class="form-control mb-4" placeholder="Search by location..." onkeyup="filterPGs()">

  <div id="pgList" class="row"></div>
</div>

<!-- BOOKING MODAL -->
<div class="modal fade" id="bookingModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Confirm Booking</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p id="selectedPG"></p>
        <input type="text" id="studentName" class="form-control" placeholder="Enter Your Name">
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" onclick="confirmBooking()">Confirm</button>
      </div>
    </div>
  </div>
</div>

<script>
const API = "http://localhost:5000/api/pgs";
let allPGs = [];
let selectedPGName = "";

fetch(API)
.then(res => res.json())
.then(data => {
  allPGs = data;
  displayPGs(allPGs);
});

function displayPGs(pgs) {
  const container = document.getElementById("pgList");
  container.innerHTML = "";

  pgs.forEach(pg => {
    container.innerHTML += `
      <div class="col-md-4 mb-4">
        <div class="card shadow">
          <img src="https://source.unsplash.com/400x250/?hostel,room" class="card-img-top">
          <div class="card-body">
            <h5>${pg.name}</h5>
            <p>📍 ${pg.location}</p>
            <p>💰 ₹${pg.pricePerRoom}</p>
            <button class="btn btn-success w-100" onclick="openBooking('${pg.name}')">
              Book Now
            </button>
          </div>
        </div>
      </div>
    `;
  });
}

function filterPGs() {
  const search = document.getElementById("search").value.toLowerCase();
  const filtered = allPGs.filter(pg =>
    pg.location.toLowerCase().includes(search)
  );
  displayPGs(filtered);
}

function openBooking(name) {
  selectedPGName = name;
  document.getElementById("selectedPG").innerText = "Booking for: " + name;
  var modal = new bootstrap.Modal(document.getElementById('bookingModal'));
  modal.show();
}

function confirmBooking() {
  const student = document.getElementById("studentName").value;
  if(student === "") {
    alert("Please enter your name!");
    return;
  }
  alert("🎉 Booking Confirmed for " + student + " at " + selectedPGName);
  location.reload();
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
