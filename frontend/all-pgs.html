<!DOCTYPE html>
<html>

<head>
<title>Find PG & Hostels</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
font-family:Poppins,sans-serif;
background-size:cover;
background-position:center;
transition:1s;
}

.overlay{
background:rgba(0,0,0,0.55);
min-height:100vh;
padding-bottom:50px;
}

.title{
text-align:center;
color:white;
padding-top:40px;
font-weight:700;
}

.search-box{
max-width:500px;
margin:auto;
margin-top:20px;
}

.search-box input{
border-radius:30px;
padding:12px;
}

.filter-container{
text-align:center;
margin:30px 0;
}

.filter-btn{
padding:10px 22px;
margin:5px;
border:none;
border-radius:30px;
background:rgba(255,255,255,0.2);
color:white;
backdrop-filter:blur(8px);
transition:0.3s;
}

.filter-btn:hover{
background:white;
color:black;
}

.pg-card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(12px);
border-radius:20px;
overflow:hidden;
color:white;
transition:0.4s;
box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

.pg-card:hover{
transform:scale(1.05);
}

.pg-card img{
height:210px;
width:100%;
object-fit:cover;
}

.pg-info{
padding:15px;
}

.price{
font-weight:bold;
color:#ffd54f;
}
</style>
</head>

<body>

<div class="overlay">

<h2 class="title">Find Your Perfect PG</h2>

<div class="search-box">
<input type="text" class="form-control"
placeholder="Search by city..."
onkeyup="searchCity(this.value)">
</div>

<div class="filter-container">
<button class="filter-btn" onclick="filterPG('all')">All</button>
<button class="filter-btn" onclick="filterPG('PG')">PG</button>
<button class="filter-btn" onclick="filterPG('Hostel')">Hostel</button>
<button class="filter-btn" onclick="filterPG('Boys')">Boys</button>
<button class="filter-btn" onclick="filterPG('Girls')">Girls</button>
<button class="filter-btn" onclick="filterPG('Unisex')">Unisex</button>
</div>

<div class="container">
<div class="row" id="pgContainer"></div>
</div>

</div>

<!-- LOGIN MODAL -->
<div class="modal fade" id="loginModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Login Required</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">
        <p>You must login to view PG details.</p>
        <a href="login.html" class="btn btn-primary">Go to Login</a>
      </div>

    </div>
  </div>
</div>

<script>
let allPGs = [];

/* Default fallback images */
const defaultImages = [
  "https://images.unsplash.com/photo-1598928506311-c55ded91a20c",
  "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2",
  "https://images.unsplash.com/photo-1560448075-bb485b067938",
  "https://images.unsplash.com/photo-1586105251261-72a756497a11"
];

/* LOAD PG */
async function loadPGs(){
  try{
    const res = await fetch("http://localhost:5000/api/pgs");
    const data = await res.json();

    allPGs = data;
    displayPGs(data);

  }catch(err){
    console.log(err);
  }
}

/* DISPLAY */
function displayPGs(list){
  const container = document.getElementById("pgContainer");
  container.innerHTML = "";

  list.forEach((pg, index) => {
    // Use pg.image if present, else pick default image
    let imgSrc = pg.image ? pg.image : defaultImages[index % defaultImages.length];

    // Ensure image always loads, fallback to default if broken
    const imgTag = `<img src="${imgSrc}" onerror="this.src='${defaultImages[index % defaultImages.length]}'">`;

    container.innerHTML += `
      <div class="col-md-4 mb-4">
        <div class="pg-card">
          ${imgTag}
          <div class="pg-info">
            <h5>${pg.name}</h5>
            <p><i class="fa fa-location-dot"></i> ${pg.location || ""} ${pg.city || ""}</p>
            <p>${pg.type} • ${pg.gender}</p>
            <p class="price">₹${pg.price}/month</p>
            <button onclick="checkLogin('${pg._id}')" class="btn btn-success w-100">
              View Details
            </button>
          </div>
        </div>
      </div>
    `;
  });
}

/* FILTER */
function filterPG(type){
  if(type === "all"){
    displayPGs(allPGs);
    return;
  }

  const filtered = allPGs.filter(pg =>
    pg.type === type || pg.gender === type
  );

  displayPGs(filtered);
}

/* SEARCH */
function searchCity(city){
  const value = city.toLowerCase();

  const filtered = allPGs.filter(pg =>
    ((pg.city || "") + (pg.location || "") + (pg.name || ""))
      .toLowerCase()
      .includes(value)
  );

  displayPGs(filtered);
}

/* BACKGROUND CHANGE */
const images = [
  "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2",
  "https://images.unsplash.com/photo-1560448075-bb485b067938",
  "https://images.unsplash.com/photo-1586105251261-72a756497a11"
];

let i = 0;
function changeBG(){
  document.body.style.backgroundImage = `url(${images[i]})`;
  i = (i + 1) % images.length;
}

setInterval(changeBG, 3000);
changeBG();

/* LOGIN CHECK */
function checkLogin(pgId){
  const user = localStorage.getItem("user");

  if(!user){
    const modal = new bootstrap.Modal(document.getElementById("loginModal"));
    modal.show();
    return;
  }

  window.location.href = "pg-details.html?id=" + pgId;
}

/* INIT */
loadPGs();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
