<!DOCTYPE html>
<html>
<head>
<title>Manage PG</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>
body{
background:#f1f5f9;
font-family:Poppins;
}
.card{
padding:15px;
margin-bottom:15px;
}
</style>

</head>

<body class="p-4">

<h3>Manage PG</h3>

<div id="pgList" class="row"></div>

<script>
window.onload = function(){

  let data = [
    {name:"ABC PG", city:"Mumbai", price:8000},
    {name:"XYZ Hostel", city:"Pune", price:6000},
    {name:"Sunshine PG", city:"Delhi", price:9000}
  ];

  let html = "";

  data.forEach(pg=>{
    html += `
    <div class="col-md-4">
      <div class="card">
        <h5>${pg.name}</h5>
        <p>${pg.city}</p>
        <p>₹${pg.price}</p>
      </div>
    </div>`;
  });

  document.getElementById("pgList").innerHTML = html;
}
</script>

</body>
</html>
