<!DOCTYPE html>
<html>
<head>

<title>PG / Hostel List</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="text-center mb-4">Available PG & Hostels</h2>

<div id="pgContainer" class="row"></div>

</div>


<script>

async function loadPGs(){

const response = await fetch("http://localhost:5000/api/pgs");
const data = await response.json();

const container = document.getElementById("pgContainer");
container.innerHTML = "";

data.forEach(pg => {

container.innerHTML += `

<div class="col-md-4">

<div class="card shadow mb-4">

<div class="card-body">

<h5>${pg.name}</h5>

<p><b>Location:</b> ${pg.location}</p>

<p><b>Price:</b> ₹${pg.price}</p>

<button class="btn btn-primary" onclick="bookPG('${pg._id}')">
Book Now
</button>

<button class="btn btn-danger" onclick="deletePG('${pg._id}')">
Delete
</button>

</div>
</div>
</div>

`;

});

}


async function deletePG(id){

await fetch("http://localhost:5000/api/pgs/"+id,{
method:"DELETE"
});

alert("PG Deleted");

loadPGs();

}


function bookPG(id){

alert("Booking PG ID: "+id);

}


loadPGs();

</script>

</body>
</html>
