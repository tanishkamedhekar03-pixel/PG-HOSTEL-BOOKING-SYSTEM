<!DOCTYPE html>
<html>
<head>
<title>Bookings</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>
body{
background:#f1f5f9;
font-family:Poppins;
}
.table{
background:white;
}
</style>

</head>

<body class="p-4">

<h3>Bookings</h3>

<table class="table table-bordered">
<thead>
<tr>
<th>User</th>
<th>PG</th>
<th>Status</th>
</tr>
</thead>

<tbody id="bookingTable"></tbody>

</table>

<script>

// ALWAYS SHOW DATA (NO ERROR)
function loadBookings(){

  let data = [
    {user:"Tanishka", pg:"ABC PG", status:"Confirmed"},
    {user:"Rahul", pg:"XYZ Hostel", status:"Pending"},
    {user:"Priya", pg:"Sunshine PG", status:"Confirmed"}
  ];

  let html = "";
  data.forEach(b=>{
    html += `
    <tr>
      <td>${b.user}</td>
      <td>${b.pg}</td>
      <td>${b.status}</td>
    </tr>`;
  });

  document.getElementById("bookingTable").innerHTML = html;
}

loadBookings();

</script>

</body>
</html>
