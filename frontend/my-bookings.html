<!DOCTYPE html>
<html>
<head>
<title>My Bookings</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<style>

body{
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  background-size: 400% 400%;
  animation: gradientMove 8s ease infinite;
  min-height: 100vh;
  color: white;
}

@keyframes gradientMove {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* CARD */
.card{
  border-radius: 20px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px);
  color: white;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  transition: 0.3s;
  overflow:hidden;
}

.card:hover{
  transform: translateY(-8px) scale(1.02);
}

/* IMAGE */
.pg-img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:15px;
  margin-bottom:10px;
}

/* STATUS BAR */
.status-bar{
  height:6px;
  border-radius:10px;
  margin-bottom:10px;
}

/* BUTTON */
.btn-outline-danger{
  border-radius:20px;
  color:white;
  border:1px solid white;
}

.btn-outline-danger:hover{
  background:red;
}

/* TEXT COLORS */
.text-success{ color:#00ff88 !important; }
.text-danger{ color:#ff4b5c !important; }
.text-warning{ color:#ffc107 !important; }

</style>

</head>

<body>

<div class="container mt-5">

<h2 class="text-center mb-4 fw-bold">My Bookings</h2>

<div id="bookingContainer" class="row"></div>

</div>

<script>

// USER CHECK
const user = JSON.parse(localStorage.getItem("user"));

if(!user){
  alert("Please login first");
  window.location.href="login.html";
}

// LOAD BOOKINGS
async function loadBookings(){

const res = await fetch("http://localhost:5000/api/bookings");
const data = await res.json();

const container = document.getElementById("bookingContainer");
container.innerHTML="";

// FILTER USER BOOKINGS
const myBookings = data.filter(
  b => b.name?.toLowerCase().trim() === user.name?.toLowerCase().trim()
);
if(myBookings.length === 0){
  console.log("Filter failed, showing all bookings");
}
// NO BOOKINGS
if(myBookings.length === 0){
  container.innerHTML = `
    <h5 class="text-center text-light">No bookings found 😔</h5>
  `;
  return;
}

// LOOP BOOKINGS
myBookings.forEach(b => {

let status = b.status || "Pending";

let color = "orange";
let textColor = "text-warning";

if(status === "Approved"){
  color = "green";
  textColor = "text-success";
}

if(status === "Rejected"){
  color = "red";
  textColor = "text-danger";
}

container.innerHTML += `
<div class="col-md-4 mb-4">

<div class="card p-3">

<img src="${b.image || 'https://images.unsplash.com/photo-1618773928121-c32242e63f39'}"
class="pg-img"/>

<div class="status-bar" style="background:${color}"></div>

<h5>${b.pgName || "PG Room"}</h5>

<p>📞 ${b.phone}</p>

<p>📅 Move Date: ${b.date}</p>

<p class="${textColor}">
<b>Status:</b> ${status}
</p>

<p>
💰 Payment:
<b style="color:${b.paymentStatus==="Paid"?"#00ff88":"orange"}">
${b.paymentStatus || "Unpaid"}
</b>
</p>

<button class="btn btn-outline-danger btn-sm"
onclick="cancelBooking('${b._id}')">
Cancel Booking
</button>

</div>

</div>
`;

});

}

// CANCEL
async function cancelBooking(id){

if(!confirm("Cancel this booking?")) return;

await fetch("http://localhost:5000/api/bookings/" + id, {
  method: "DELETE"
});

alert("Booking Cancelled ❌");

loadBookings();
}

// INIT
loadBookings();

</script>

</body>
</html>
